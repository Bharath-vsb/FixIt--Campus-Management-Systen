databases:
  - name: fixit-db
    plan: free

services:
  - type: web
    name: fixit-backend
    runtime: docker
    plan: free
    rootDir: backend
    healthCheckPath: /health

    envVars:
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: fixit-db
          property: connectionString

      - key: STORAGE_PROVIDER
        value: Cloudinary

      - key: CLOUDINARY_URL
        sync: false

      - key: Jwt__Key
        sync: false

      - key: Jwt__Issuer
        sync: false

      - key: Jwt__Audience
        sync: false

      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: fixit-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist

    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    envVars:
      - key: VITE_API_BASE_URL
        sync: false
