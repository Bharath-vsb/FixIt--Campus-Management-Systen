<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

<body class="bg-surface min-h-screen flex items-center justify-center p-4 font-body-md text-on-surface">
<main class="w-full max-w-container-max mx-auto flex flex-col md:flex-row gap-lg md:gap-xl justify-center items-stretch">
<!-- Login Section -->
<section class="w-full md:w-1/2 max-w-md bg-surface-container-lowest rounded-xl shadow-[0_4px_6px_-1px_rgba(15,23,42,0.05)] border-l-2 border-primary p-lg md:p-xl flex flex-col">
<div class="flex items-center gap-sm mb-lg">
<img alt="FixIt Logo" class="w-12 h-12 object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBQorr6ZzpgdjNHMF4SAEXAfz4DzvTseEZ-0BZjtpkSyf0nJhJigMJUnKO1kALEwW0LHHspy_AtGJVqodcegM5HdOFGp1-VlBvraeKJoQnsRAQdAu-QBk5qU0Lg6ybpv8uIpCRRQy4DGGeuUaYOs5CvgyP03fXX6I5YHg3u0aniCQuEOa80itbRPirxkCR4blF19ZAXXqDJ7sJIWXRD_DnregVPJ8EA52Pzh21Y-kCVG5AlsTL_SyO8"/>
<h1 class="text-headline-md font-headline-md text-primary">FixIt</h1>
</div>
<h2 class="text-headline-md font-headline-md mb-sm text-on-surface">Welcome Back</h2>
<p class="text-body-md font-body-md text-on-surface-variant mb-lg">Sign in to manage facilities and report issues.</p>
<form class="space-y-md mb-lg flex-grow">
<div>
<label class="block text-label-md font-label-md text-on-surface mb-xs" for="login-email">Email</label>
<input class="w-full px-sm py-sm border border-outline-variant rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary text-body-md bg-surface-bright" id="login-email" placeholder="Enter your email" type="email"/>
</div>
<div>
<label class="block text-label-md font-label-md text-on-surface mb-xs" for="login-password">Password</label>
<input class="w-full px-sm py-sm border border-outline-variant rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary text-body-md bg-surface-bright" id="login-password" placeholder="Enter your password" type="password"/>
</div>
<div class="flex items-center justify-between">
<label class="flex items-center gap-xs">
<input class="rounded border-outline-variant text-primary focus:ring-primary h-4 w-4" type="checkbox"/>
<span class="text-label-sm font-label-sm text-on-surface-variant">Remember me</span>
</label>
<a class="text-label-sm font-label-sm text-primary hover:underline" href="#">Forgot password?</a>
</div>
<button class="w-full bg-primary text-on-primary py-sm rounded-lg text-label-md font-label-md hover:bg-on-surface-variant transition-colors mt-lg" type="button">Login</button>
</form>
<div class="mt-auto">
<div class="relative py-4">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant"></div>
</div>
<div class="relative flex justify-center">
<span class="bg-surface-container-lowest px-4 text-label-sm font-label-sm text-on-surface-variant">Demo Shortcuts</span>
</div>
</div>
<div class="flex flex-col gap-sm">
<button class="w-full bg-surface-container-low text-on-surface py-sm rounded-lg text-label-sm font-label-sm hover:bg-surface-container-highest transition-colors flex items-center justify-center gap-xs" type="button">
<span class="material-symbols-outlined text-[18px]">school</span> Login as Student
                    </button>
<button class="w-full bg-surface-container-low text-on-surface py-sm rounded-lg text-label-sm font-label-sm hover:bg-surface-container-highest transition-colors flex items-center justify-center gap-xs" type="button">
<span class="material-symbols-outlined text-[18px]">badge</span> Login as Staff
                    </button>
<button class="w-full bg-surface-container-low text-on-surface py-sm rounded-lg text-label-sm font-label-sm hover:bg-surface-container-highest transition-colors flex items-center justify-center gap-xs" type="button">
<span class="material-symbols-outlined text-[18px]">admin_panel_settings</span> Login as Admin
                    </button>
</div>
</div>
</section>
<!-- Registration Section -->
<section class="w-full md:w-1/2 max-w-md bg-surface-container-lowest rounded-xl shadow-[0_4px_6px_-1px_rgba(15,23,42,0.05)] border-l-2 border-secondary p-lg md:p-xl flex flex-col">
<h2 class="text-headline-md font-headline-md mb-sm text-on-surface">Create Account</h2>
<p class="text-body-md font-body-md text-on-surface-variant mb-lg">Join FixIt to report issues and track campus maintenance.</p>
<form class="space-y-md flex-grow">
<div>
<label class="block text-label-md font-label-md text-on-surface mb-xs" for="reg-name">Full Name</label>
<input class="w-full px-sm py-sm border border-outline-variant rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary text-body-md bg-surface-bright" id="reg-name" placeholder="John Doe" type="text"/>
</div>
<div>
<label class="block text-label-md font-label-md text-on-surface mb-xs" for="reg-email">Email</label>
<input class="w-full px-sm py-sm border border-outline-variant rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary text-body-md bg-surface-bright" id="reg-email" placeholder="john.doe@university.edu" type="email"/>
</div>
<div>
<label class="block text-label-md font-label-md text-on-surface mb-xs" for="reg-role">Role</label>
<select class="w-full px-sm py-sm border border-outline-variant rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary text-body-md bg-surface-bright" id="reg-role">
<option value="student">Student</option>
<option value="staff">Staff</option>
</select>
</div>
<div>
<label class="block text-label-md font-label-md text-on-surface mb-xs" for="reg-password">Password</label>
<input class="w-full px-sm py-sm border border-outline-variant rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary text-body-md bg-surface-bright" id="reg-password" placeholder="Create a strong password" type="password"/>
</div>
<div>
<label class="block text-label-md font-label-md text-on-surface mb-xs" for="reg-confirm-password">Confirm Password</label>
<input class="w-full px-sm py-sm border border-outline-variant rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary text-body-md bg-surface-bright" id="reg-confirm-password" placeholder="Confirm your password" type="password"/>
</div>
<button class="w-full bg-secondary text-on-secondary py-sm rounded-lg text-label-md font-label-md hover:bg-secondary-fixed-variant transition-colors mt-lg" type="button">Create Account</button>
</form>
</section>
</main>
</body></html>
