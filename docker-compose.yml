services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: fixit_user
      POSTGRES_PASSWORD: fixit_password
      POSTGRES_DB: fixit_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=db;Database=fixit_db;Username=fixit_user;Password=fixit_password
      - Jwt__Key=ThisIsASecretKeyForJwtTokensThatIsLongEnoughToWorkProperly
      - Jwt__Issuer=FixItApp
      - Jwt__Audience=FixItUsers
      - UploadSettings__UploadsRoot=/app/uploads
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads_data:
